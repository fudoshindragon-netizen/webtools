<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organic Chemistry Practice — Free Study & Practice Drills</title>
    <meta name="description" content="Free organic chemistry study aid with topic explanations and practice questions. Instant feedback and worked solutions." />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon">🧪</span>
          <div>
            <h1 id="app-title">Organic Chemistry Practice</h1>
            <p id="app-subtitle" class="subtitle">Free study & practice drills</p>
          </div>
        </div>
        <div class="mastery-chip" id="overall-mastery-chip" title="Overall mastery across all topics">
          <span class="mastery-badge" id="overall-badge">—</span>
          <span id="overall-percent">0%</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- Topic list view -->
      <section id="topic-list-view">
        <p class="view-intro">Pick a topic to read the concept summary, then answer practice questions with instant feedback and worked solutions.</p>
        <div class="topic-grid" id="topic-grid"></div>
      </section>

      <!-- Topic detail view -->
      <section id="topic-detail-view" class="hidden">
        <button class="back-btn" id="back-btn" type="button">← All topics</button>
        <div id="topic-detail"></div>
      </section>
    </main>

    <footer class="app-footer">
      <p id="app-disclaimer"></p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
