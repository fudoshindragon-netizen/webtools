name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sales-page/**'
      - '.github/workflows/android-debug.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sales-page/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Android SDK
        run: |
          if [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          else
            echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          fi
      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Bundle the tracker and sync Capacitor
        run: |
          node scripts/write-capacitor-config.mjs
          npm run build:app
          npx cap sync android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew && android/gradlew -p android assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/luna-cycle-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: luna-cycle-debug
          path: sales-page/android/app/build/outputs/apk/debug/luna-cycle-debug.apk
          if-no-files-found: error
